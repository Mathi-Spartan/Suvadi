<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">

<meta name="description" content="The Tamil chieftains who fought the East India Company, 1755–1801: Puli Thevar, Velu Nachiyar, Kattabomman, the Maruthu brothers and more. Sourced stories in Tamil and English.">

<meta name="theme-color" content="#071226" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="பாளையக்காரர் எழுச்சி · Palayakkarar Resistance">
<meta property="og:description" content="Fifty years of Tamil resistance to the East India Company, before 1857. Sourced stories in Tamil and English.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a palm-leaf (olai) chronicle — one leaf as the hero, a ruled timeline, a register of heroes, a survey-sheet map, and a long-form reader. */
:root{
  color-scheme:light;
  --paper:#F4F7FB; --surface:#FFFFFF; --ink:#0B1B3A; --muted:#47567A; --line:#DCE4EF;
  --blue:#0174C3; --blue-soft:rgba(1,116,195,.1); --ember:#C25E00; --ember-soft:rgba(255,127,0,.12); --warn:#9a5b00; --warn-soft:#fbf1dc;
  --leaf:#efe3c4; --leaf-edge:#c9b483; --leaf-ink:#3b2c10;
  --f-display:'Onest', system-ui, sans-serif;
  --f-tamil:'Anek Tamil', 'Hind Madurai', sans-serif;
  --f-body:'Onest', 'Hind Madurai', system-ui, sans-serif;
  --f-read:"Source Serif 4", Georgia, serif;
  --r-s:6px; --r-m:12px; --r-pill:999px;
  --ease-out:cubic-bezier(.2,.7,.2,1); --dur-1:140ms; --dur-2:260ms;
  --step--1:clamp(.82rem,.8rem + .1vw,.88rem); --step-0:clamp(1rem,.96rem + .2vw,1.08rem);
  --step-1:clamp(1.2rem,1.1rem + .5vw,1.45rem); --step-2:clamp(1.5rem,1.3rem + 1.1vw,2.1rem);
  --step-3:clamp(2rem,1.5rem + 2.6vw,3.5rem);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#071226; --surface:#0D1C36; --ink:#EAF1FF; --muted:#A9B8D6; --line:#1E3156;
  --blue:#3BA0F0; --blue-soft:rgba(59,160,240,.14); --ember:#FFA24D; --ember-soft:rgba(255,127,0,.16); --warn:#f0b75a; --warn-soft:#3a2c12;
  --leaf:#3a3120; --leaf-edge:#6b5a33; --leaf-ink:#f3e6c6; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#071226; --surface:#0D1C36; --ink:#EAF1FF; --muted:#A9B8D6; --line:#1E3156;
  --blue:#3BA0F0; --blue-soft:rgba(59,160,240,.14); --ember:#FFA24D; --ember-soft:rgba(255,127,0,.16); --warn:#f0b75a; --warn-soft:#3a2c12;
  --leaf:#3a3120; --leaf-edge:#6b5a33; --leaf-ink:#f3e6c6; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--step-0);line-height:1.65}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ta{font-family:var(--f-tamil)}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}
.disp{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em}
html[lang="ta"] .disp{font-family:var(--f-tamil);font-weight:700;line-height:1.35}
h2.disp{font-size:var(--step-2)}
p{margin:0}
a{color:var(--blue)}
button{font:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.eyebrow{font-size:var(--step--1);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
html[lang="ta"] .eyebrow{letter-spacing:.02em;text-transform:none}
section{padding-block:clamp(40px,6vw,72px);border-top:1px solid var(--line)}
.sec-head{display:grid;gap:8px;margin-bottom:24px;max-width:65ch}
.sec-head .alt{color:var(--muted)}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid var(--line);background:var(--surface)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand .mk{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(140deg,var(--blue),#21468B);color:#fff;font-family:var(--f-tamil);font-size:15px;flex:none}
.crumb{font-size:var(--step--1);color:var(--muted)}
.crumb b{color:var(--ink);font-weight:700}
.bar-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{font-size:var(--step--1);text-decoration:none;color:var(--muted);padding:4px 10px;border-radius:var(--r-pill)}
.nav a:hover{background:var(--blue-soft);color:var(--blue)}
.nav a{white-space:nowrap}
@media (max-width:640px){.bar-r{width:100%;flex-wrap:nowrap}.nav{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.bar .crumb{display:none}}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-pill);padding:2px;background:var(--paper)}
.lang button{border:0;background:transparent;color:var(--muted);padding:4px 12px;border-radius:var(--r-pill);cursor:pointer;font-size:var(--step--1);font-weight:500}
.lang button[aria-pressed="true"]{background:var(--blue);color:var(--surface)}
.lang button[lang="ta"]{font-family:var(--f-tamil)}

/* hero */
.hero{padding-block:clamp(32px,6vw,64px) clamp(28px,4vw,48px);border-top:0}
.hero .kick{font-family:var(--f-tamil);font-size:var(--step-1);font-weight:700;color:var(--blue);line-height:1.4}
.hero h1{font-size:var(--step-3);margin-top:10px;max-width:20ch}
html[lang="ta"] .hero h1{font-size:var(--step-2);max-width:28ch}
.hero .lede{margin-top:16px;max-width:62ch;color:var(--muted);font-size:var(--step-1);line-height:1.55}
html[lang="ta"] .hero .lede{font-size:var(--step-0);line-height:1.8}
.leaf{margin-top:32px;position:relative;background:var(--leaf);border:1px solid var(--leaf-edge);border-radius:40px/50%;
  padding:22px clamp(48px,8vw,96px);color:var(--leaf-ink);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  background-image:repeating-linear-gradient(0deg,transparent 0 11px,color-mix(in srgb,var(--leaf-edge) 35%,transparent) 11px 12px)}
.leaf::before,.leaf::after{content:"";position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--paper);border:1px solid var(--leaf-edge)}
.leaf::before{left:clamp(18px,3vw,36px)}.leaf::after{right:clamp(18px,3vw,36px)}
.leaf .yr{font-family:var(--f-display);font-weight:800;font-size:var(--step-3);line-height:1}
.leaf .mid{flex:1;min-width:160px;text-align:center;font-family:var(--f-tamil);font-size:var(--step--1)}
.leaf .mid span{display:block;font-family:var(--f-body);opacity:.85}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:24px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;display:grid;gap:4px;align-content:start}
.fact .n{font-family:var(--f-display);font-weight:800;font-size:var(--step-2);color:var(--blue);font-variant-numeric:tabular-nums;line-height:1.1}
.fact p{font-size:var(--step--1);color:var(--muted)}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:var(--r-pill);cursor:pointer;font-size:var(--step--1);transition:background var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out)}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--surface)}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:grid}
.ev{display:grid;grid-template-columns:minmax(96px,132px) 1fr;gap:16px;padding-block:18px;border-bottom:1px solid var(--line)}
.ev .when{font-variant-numeric:tabular-nums;font-weight:700;font-size:var(--step--1)}
.ev .when span{display:block;font-family:var(--f-display);font-weight:800;font-size:var(--step-1);color:var(--blue)}
.ev.fall .when span{color:var(--ember)}
.ev h3{font-size:var(--step-0);font-weight:700}
html[lang="ta"] .ev h3{font-family:var(--f-tamil);font-weight:600}
.ev .body{min-width:0;display:grid;gap:6px}
.ev .body p{color:var(--muted);max-width:65ch}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:var(--step--1)}
.place{color:var(--muted)}
.tag{font-size:.75rem;padding:1px 8px;border-radius:var(--r-pill);font-weight:500}
.tag.disp-t{background:var(--warn-soft);color:var(--warn)}
.tag.fallen{background:var(--ember-soft);color:var(--ember)}
.tag.era{background:var(--blue-soft);color:var(--blue)}
.read{justify-self:start;border:0;background:none;color:var(--blue);padding:0;font-weight:700;cursor:pointer;font-size:var(--step--1)}
.read:hover{text-decoration:underline}
.empty{color:var(--muted);padding:16px 0}
@media (max-width:520px){.ev{grid-template-columns:1fr;gap:6px}.ev .when span{display:inline;margin-right:8px}}

/* heroes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{text-align:left;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px;cursor:pointer;display:grid;gap:6px;align-content:start;transition:border-color var(--dur-1) var(--ease-out),transform var(--dur-2) var(--ease-out)}
.card:hover{border-color:var(--blue);transform:translateY(-2px)}
.card .nm{font-family:var(--f-tamil);font-size:var(--step-1);font-weight:700;line-height:1.35}
.card .sub{font-weight:700;font-size:var(--step--1);color:var(--muted)}
.card .yrs{font-size:var(--step--1);color:var(--muted);font-variant-numeric:tabular-nums}
.card .role{font-size:var(--step--1)}
.card .fate{font-size:var(--step--1);color:var(--ember)}
.card .more{font-size:var(--step--1);color:var(--blue);font-weight:700;margin-top:6px}
.subhead{margin:32px 0 12px;font-weight:700}
.subhead span{display:block;font-weight:400;color:var(--muted);font-size:var(--step--1)}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.mapwrap{grid-template-columns:1fr}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.sheet svg{display:block;width:100%;height:auto}
.sheet .grat{stroke:var(--line);stroke-width:1;fill:none}
.sheet .glab{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.sheet .pt{cursor:pointer}
.sheet .pt circle{fill:var(--blue);stroke:var(--surface);stroke-width:2}
.sheet .pt.fall circle{fill:var(--ember)}
.sheet .pt text{fill:var(--ink);font-size:12px;font-family:var(--f-body)}
html[lang="ta"] .sheet .pt text{font-family:var(--f-tamil);font-size:11px}
.sheet .pt.on circle{r:9}
.sheet .pt:focus-visible{outline:none}
.sheet .pt:focus-visible circle{stroke:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:var(--step--1);color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.pinfo{display:grid;gap:10px}
.pinfo h3{font-size:var(--step-1)}
.pinfo p{color:var(--muted)}
.plist{display:flex;flex-wrap:wrap;gap:6px}

/* disputes */
.disputes{display:grid;gap:12px}
.dsp{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:var(--r-s);padding:16px;display:grid;gap:6px}
.dsp h3{font-size:var(--step-0)}
.dsp p{color:var(--muted);font-size:var(--step--1);max-width:75ch}

/* glossary */
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 24px;margin:0}
.gloss div{padding-block:12px;border-bottom:1px solid var(--line)}
.gloss dt{font-weight:700}.gloss dt .alt{font-weight:500;color:var(--blue);margin-left:6px}
.gloss dd{margin:4px 0 0;color:var(--muted);font-size:var(--step--1)}

.sources{columns:2 280px;column-gap:32px;padding-left:24px;margin:0;font-size:var(--step--1)}
.sources li{break-inside:avoid;margin-bottom:8px;color:var(--muted)}
.src{font-size:.78rem;color:var(--muted)}
footer{border-top:1px solid var(--line);padding-block:32px;color:var(--muted);font-size:var(--step--1)}

/* reader */
dialog.reader{border:0;padding:0;margin:auto;width:min(760px,100%);max-width:100%;height:min(92vh,100%);max-height:100%;border-radius:var(--r-m);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,20,40,.25)}
dialog.reader::backdrop{background:rgba(10,20,40,.5)}
@media (max-width:640px){dialog.reader{height:100%;border-radius:0}}
.rd{display:flex;flex-direction:column;height:100%}
.rd-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:max(10px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);flex-wrap:wrap}
.rd-top .eyebrow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-pill);padding:5px 12px;cursor:pointer;font-size:var(--step--1)}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.rd-body{overflow:auto;flex:1;padding:clamp(20px,4vw,40px) max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
article.story{max-width:62ch;margin:0 auto;display:grid;gap:18px}
article.story h1{font-size:var(--step-2)}
article.story .dek{font-size:var(--step-1);color:var(--muted);line-height:1.5}
html[lang="ta"] article.story .dek{font-size:var(--step-0);line-height:1.85}
article.story .rmeta{display:flex;gap:8px 16px;flex-wrap:wrap;font-size:var(--step--1);color:var(--muted);padding-bottom:12px;border-bottom:1px solid var(--line)}
article.story h2{font-family:var(--f-body);font-weight:700;font-size:var(--step-1);margin-top:12px}
html[lang="ta"] article.story h2{font-family:var(--f-tamil);font-size:var(--step-0)}
article.story p{font-family:var(--f-read);font-size:1.12rem;line-height:1.75}
html[lang="ta"] article.story p{font-family:var(--f-body);font-size:1.08rem;line-height:1.95}
article.story .trad{background:var(--leaf);color:var(--leaf-ink);border-radius:var(--r-s);padding:14px 16px;display:grid;gap:6px}
article.story .trad b,article.story .note b{font-family:var(--f-body);font-size:var(--step--1);letter-spacing:.04em}
article.story .trad p{font-size:1rem;font-style:italic}
html[lang="ta"] article.story .trad p{font-style:normal}
article.story .note{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px}
article.story .note p{font-family:var(--f-body);font-size:var(--step--1);color:var(--muted);line-height:1.6}
article.story .rel{display:grid;gap:8px}
article.story .rel ul{margin:0;padding-left:20px;display:grid;gap:4px;font-size:var(--step--1)}
.rd-foot{display:flex;justify-content:space-between;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.rd-foot .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{border:0;background:none;padding:0;color:var(--blue);cursor:pointer;text-align:left;font-size:inherit}
.linkbtn:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="bar"><div class="wrap">
  <a class="brand" href="/" aria-label="Suvadi home"><span class="mk" aria-hidden="true"><b>சு</b></span><span class="crumb"><span data-i="crumb0"></span> <span aria-hidden="true">/</span> <b data-i="crumb1"></b></span></a>
  <div class="bar-r">
    <nav class="nav" aria-label="Sections">
      <a href="#timeline" data-i="nav1"></a><a href="#heroes" data-i="nav2"></a><a href="#map" data-i="nav3"></a><a href="#records" data-i="nav4"></a><a href="#sources" data-i="nav5"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" lang="ta" data-lang="ta">தமிழ்</button><button type="button" lang="en" data-lang="en">English</button>
    </div>
  </div>
</div></div>

<main>
<header class="hero"><div class="wrap">
  <p class="kick" lang="ta">விடுதலையின் முதல் முழக்கம்</p>
  <h1 class="disp" data-i="h1"></h1>
  <p class="lede" data-i="lede"></p>
  <div class="leaf" role="img" aria-label="1755 – 1801">
    <span class="yr">1755</span>
    <span class="mid" lang="ta">நெற்கட்டும்செவல் → திருப்பத்தூர்<span data-i="leaf"></span></span>
    <span class="yr">1801</span>
  </div>
  <div class="facts" id="facts"></div>
</div></header>

<section id="timeline"><div class="wrap">
  <div class="sec-head">
    <p class="eyebrow" data-i="tlEy"></p>
    <h2 class="disp" data-i="tlH"></h2>
    <p data-i="tlP"></p>
  </div>
  <div class="chips" id="tlChips" role="group"></div>
  <ol class="tl" id="tl"></ol>
</div></section>

<section id="heroes"><div class="wrap">
  <div class="sec-head">
    <p class="eyebrow" data-i="hEy"></p>
    <h2 class="disp" data-i="hH"></h2>
    <p data-i="hP"></p>
  </div>
  <div class="grid" id="heroGrid"></div>
  <p class="subhead"><span data-i="oH" style="display:inline;color:var(--ink);font-size:inherit;font-weight:700"></span><span data-i="oP"></span></p>
  <div class="grid" id="otherGrid"></div>
</div></section>

<section id="map"><div class="wrap">
  <div class="sec-head">
    <p class="eyebrow" data-i="mEy"></p>
    <h2 class="disp" data-i="mH"></h2>
    <p data-i="mP"></p>
  </div>
  <div class="mapwrap">
    <div class="sheet">
      <svg id="mapSvg" viewBox="0 0 420 600" role="group"></svg>
      <div class="legend"><span><i style="background:var(--blue)"></i><span data-i="lg1"></span></span><span><i style="background:var(--ember)"></i><span data-i="lg2"></span></span></div>
    </div>
    <div class="pinfo" id="pinfo" aria-live="polite"></div>
  </div>
</div></section>

<section id="records"><div class="wrap">

    <p class="eyebrow" data-i="rEy"></p>

  </div>

</div></section>

<section id="glossary"><div class="wrap">

    <h2 class="disp" data-i="gH"></h2>
  </div>

</div></section>

<section id="sources"><div class="wrap">
  <div class="sec-head">
    <p class="eyebrow" data-i="sEy"></p>
    <h2 class="disp" data-i="sH"></h2>
    <p data-i="sP"></p>
  </div>
  <ol class="sources" id="srcList"></ol>
</div></section>

  {q:{en:"Did Heron's guns fail at Nerkattumseval?",ta:"நெற்கட்டும்செவலில் ஹெரானின் பீரங்கிகள் தோற்றனவா?"},a:{en:"Some popular accounts say Heron's artillery could not breach the fort. The state history texts say he abandoned the attack because he had no cannon, supplies or pay. We follow the state texts.",ta:"ஹெரானின் பீரங்கிகளால் கோட்டையை உடைக்க முடியவில்லை என்று சில பிரபலக் கணக்குகள் கூறுகின்றன. பீரங்கியும் உணவும் சம்பளமும் இல்லாததால் அவர் தாக்குதலைக் கைவிட்டார் என்று அரசுப் பாடநூல்கள் கூறுகின்றன. அரசுப் பாடநூல்களைப் பின்பற்றுகிறோம்."},s:[1,3]},
  {q:{en:"How did Puli Thevar die?",ta:"பூலித்தேவன் எப்படி மறைந்தார்?"},a:{en:"The state text says he escaped and died in exile, and that nothing certain is known of his last days. Some accounts give 16 October 1767 as his date of death. We treat it as unknown.",ta:"அவர் தப்பித் தலைமறைவில் மறைந்தார், இறுதி நாட்கள் பற்றி உறுதியாக எதுவும் தெரியவில்லை என்று அரசுப் பாடநூல் கூறுகிறது. சில கணக்குகள் 1767 அக்டோபர் 16 எனத் தருகின்றன. அதை அறியப்படாதது எனக் கருதுகிறோம்."},s:[2,26]},
  {q:{en:"Who was Udaiyaal?",ta:"உடையாள் யார்?"},a:{en:"One state text says Velu Nachiyar's women's regiment was named after a shepherd girl killed for refusing to betray Kuyili. Another says Udaiyaal was the queen's adopted daughter who blew up a British arsenal.",ta:"குயிலியைக் காட்டிக்கொடுக்க மறுத்துக் கொல்லப்பட்ட ஓர் இடைச்சிறுமியின் பெயரால் வேலு நாச்சியாரின் பெண்கள் படை அழைக்கப்பட்டது என்று ஒரு அரசுப் பாடநூல் கூறுகிறது. உடையாள் அரசியின் வளர்ப்பு மகள், அவரே ஓர் ஆங்கிலேய ஆயுதக் கிடங்கைத் தகர்த்தார் என்று மற்றொன்று கூறுகிறது."},s:[1,2]},
  {q:{en:"How much is known about Kuyili?",ta:"குயிலி பற்றி எவ்வளவு தெரியும்?"},a:{en:"The destruction of the armoury is in the state texts and on the Ministry of Culture portal. Her birth date, family and earlier deeds come mainly from folk songs and oral history.",ta:"ஆயுதக் கிடங்கு அழிக்கப்பட்டது அரசுப் பாடநூல்களிலும் பண்பாட்டு அமைச்சகத் தளத்திலும் பதிவாகியுள்ளது. அவரது பிறந்த நாள், குடும்பம், முந்தைய செயல்கள் பெரும்பாலும் நாட்டுப்புறப் பாடல்களிலிருந்தும் வாய்மொழி வரலாற்றிலிருந்தும் வருகின்றன."},s:[6,20]},
  {q:{en:"When did Kattabomman's garrison leave Panchalankurichi?",ta:"கட்டபொம்மனின் காவற்படை பாஞ்சாலங்குறிச்சியை எப்போது விட்டது?"},a:{en:"A journal study says the fort was evacuated by night about two days after the 5 September assault. A state text says reinforcements arrived on 16 September, when the walls broke and the garrison withdrew to Kadalkudi.",ta:"செப்டம்பர் 5 தாக்குதலுக்குச் சுமார் இரண்டு நாட்களில் கோட்டை இரவில் கைவிடப்பட்டது என்று ஓர் ஆய்விதழ்க் கட்டுரை கூறுகிறது. செப்டம்பர் 16 அன்று கூடுதல் படை வந்து சுவர் உடைந்ததும் காவற்படை கடலக்குடிக்குப் பின்வாங்கியது என்று ஓர் அரசுப் பாடநூல் கூறுகிறது."},s:[22,2]},
  {q:{en:"When was Kattabomman captured?",ta:"கட்டபொம்மன் எப்போது பிடிபட்டார்?"},a:{en:"Accounts give 24 September or 1 October 1799. All agree he was seized in the Pudukkottai country and handed to the Company.",ta:"1799 செப்டம்பர் 24 என்றும் அக்டோபர் 1 என்றும் கணக்குகள் தருகின்றன. புதுக்கோட்டைச் சீமையில் பிடிபட்டுக் கம்பெனியிடம் ஒப்படைக்கப்பட்டார் என்பதில் அனைத்தும் ஒத்துப்போகின்றன."},s:[10,2]},
  {q:{en:"Was Kattabomman hanged on 16 or 17 October, and how?",ta:"கட்டபொம்மன் அக்டோபர் 16-ஆ 17-ஆ, எப்படித் தூக்கிலிடப்பட்டார்?"},a:{en:"Most sources give 16 October 1799; one state text says he was tried on the 16th and hanged on the 17th. The 1999 stamp citation, based on a Kattabomman association's text, says he put the noose round his own neck.",ta:"பெரும்பாலான ஆதாரங்கள் 1799 அக்டோபர் 16 எனத் தருகின்றன; 16 அன்று விசாரிக்கப்பட்டு 17 அன்று தூக்கிலிடப்பட்டார் என்று ஓர் அரசுப் பாடநூல் கூறுகிறது. கட்டபொம்மன் கழகக் குறிப்பை அடிப்படையாகக் கொண்ட 1999 அஞ்சல் தலைக் குறிப்பு, அவர் தானே கயிற்றைக் கழுத்தில் மாட்டிக்கொண்டார் என்கிறது."},s:[1,2,8]},
  {q:{en:"Did Sundaralingam die in 1799 or 1801?",ta:"சுந்தரலிங்கம் 1799-இல் மறைந்தாரா, 1801-இலா?"},a:{en:"Most accounts place his death at the 1799 siege. Another view places it in the second war while serving Oomaithurai.",ta:"பெரும்பாலான கணக்குகள் 1799 முற்றுகையில் அவர் மறைந்ததாகக் கூறுகின்றன. இரண்டாம் போரில் ஊமைத்துரையுடன் இருந்தபோது மறைந்தார் என்பது மற்றொரு பார்வை."},s:[17]},
  {q:{en:"Who took Panchalankurichi in 1801, and when?",ta:"1801-இல் பாஞ்சாலங்குறிச்சியை யார், எப்போது கைப்பற்றினார்?"},a:{en:"One state text says Colin Macaulay retook it in April 1801. Wikipedia and the journal study say Macaulay's attacks failed and Agnew took it in May 1801.",ta:"1801 ஏப்ரலில் கோலின் மெக்காலே அதை மீட்டார் என்று ஓர் அரசுப் பாடநூல் கூறுகிறது. மெக்காலேயின் தாக்குதல்கள் தோற்றன, 1801 மேயில் அக்னியூ கைப்பற்றினார் என்று விக்கிப்பீடியாவும் ஆய்விதழ்க் கட்டுரையும் கூறுகின்றன."},s:[1,11,22]},
  {q:{en:"When were the Maruthu brothers executed?",ta:"மருது சகோதரர்கள் எப்போது தூக்கிலிடப்பட்டனர்?"},a:{en:"Some summaries say 16 November 1801, together with Oomaithurai. The Sivaganga district record and the 2004 stamp give 24 October 1801 at Tiruppattur; Oomaithurai died on 16 November at Panchalankurichi.",ta:"ஊமைத்துரையுடன் சேர்த்து 1801 நவம்பர் 16 என்று சில சுருக்கங்கள் கூறுகின்றன. சிவகங்கை மாவட்டப் பதிவும் 2004 அஞ்சல் தலையும் 1801 அக்டோபர் 24, திருப்பத்தூர் எனத் தருகின்றன; ஊமைத்துரை நவம்பர் 16 அன்று பாஞ்சாலங்குறிச்சியில் மறைந்தார்."},s:[4,29,11]},
  {q:{en:"What was the date of the Carnatic Treaty?",ta:"கர்நாடக உடன்படிக்கையின் தேதி என்ன?"},a:{en:"Sources give both 26 July and 31 July 1801.",ta:"1801 ஜூலை 26 என்றும் ஜூலை 31 என்றும் ஆதாரங்கள் தருகின்றன."},s:[12,1]},
  {q:{en:"When was Dheeran Chinnamalai hanged?",ta:"தீரன் சின்னமலை எப்போது தூக்கிலிடப்பட்டார்?"},a:{en:"Most records give 31 July 1805; some give 2 or 3 August 1805.",ta:"பெரும்பாலான பதிவுகள் 1805 ஜூலை 31 எனத் தருகின்றன; சில ஆகஸ்ட் 2 அல்லது 3 எனத் தருகின்றன."},s:[27,13]}
];

const GLOSS = [
  {en:"Palayam",ta:"பாளையம்",d:{en:"A military fief. The Madurai country had seventy-two.",ta:"படைப் பணிக்காக வழங்கப்பட்ட நிலப்பகுதி. மதுரைச் சீமையில் எழுபத்திரண்டு இருந்தன."}},
  {en:"Palayakkarar",ta:"பாளையக்காரர்",d:{en:"Holder of a palayam; anglicised by the British as 'Polygar'.",ta:"பாளையத்தின் தலைவர்; ஆங்கிலேயர் 'பாலிகர்' என்று அழைத்தனர்."}},
  {en:"Kappam / Kisti",ta:"கப்பம் / கிஸ்தி",d:{en:"The tribute or tax demanded from each palayam.",ta:"ஒவ்வொரு பாளையத்திடமும் கோரப்பட்ட திறை அல்லது வரி."}},
  {en:"Desakaval",ta:"தேசகாவல்",d:{en:"The village watch and its fees, taken over by the Company in 1799.",ta:"கிராமக் காவலும் அதன் கட்டணமும்; 1799-இல் கம்பெனி கைப்பற்றியது."}},
  {en:"Pagoda",ta:"வராகன்",d:{en:"A gold coin, worth about three and a half rupees; the unit of tribute.",ta:"சுமார் மூன்றரை ரூபாய் மதிப்புள்ள தங்க நாணயம்; கப்பம் இதில் கணக்கிடப்பட்டது."}},
  {en:"Nawab of Arcot",ta:"ஆற்காடு நவாப்",d:{en:"Ruler of the Carnatic who sold his tribute rights to the Company.",ta:"தன் கப்ப உரிமைகளைக் கம்பெனியிடம் ஒப்படைத்த கர்நாடகத்தின் ஆட்சியாளர்."}},
  {en:"Valari",ta:"வளரி",d:{en:"A curved Tamil throwing weapon.",ta:"தமிழரின் வளைந்த எறிகருவி."}},
  {en:"Jambudweepa",ta:"ஜம்புத்தீவு",d:{en:"Old name for the Indian peninsula, used in the 1801 proclamation.",ta:"இந்தியத் தீபகற்பத்தின் பழம்பெயர்; 1801 பிரகடனத்தில் பயன்படுத்தப்பட்டது."}},
  {en:"Zamindari",ta:"ஜமீன்தாரி",d:{en:"The landholding system that replaced the palayams after 1801.",ta:"1801-க்குப் பின் பாளையங்களுக்குப் பதிலாக வந்த நில உடைமை முறை."}}
];

/* ───────── state ───────── */
let lang = "ta", filter = "all";
try{ const h=location.hash.slice(1); const s=localStorage.getItem("palayam-lang"); lang = (h==="en"||h==="ta") ? h : (s==="en"||s==="ta") ? s : "ta"; }catch(e){}
try{ const f=localStorage.getItem("palayam-filter"); if(f && (f==="all"||P[f])) filter=f }catch(e){}
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const T = k => UI[lang][k];
const S = id => (window.STORIES && window.STORIES[lang] && window.STORIES[lang][id]) || window.STORIES.en[id];
const srcLinks = ids => ids.map(i => `<a href="#src-${i}">[${i}]</a>`).join(" ");
const nm = p => lang==="ta" ? p.ta : p.en;
const nm2 = p => lang==="ta" ? p.en : p.ta;

function renderStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = T(el.dataset.i) });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===lang));
  $("#facts").innerHTML = FACTS.map(f => `<div class="fact"><span class="n">${esc(typeof f.n==="object"?f.n[lang]:f.n)}</span><p>${esc(f[lang])}</p></div>`).join("");
}
function chips(){
  const opts = [["all",T("all")], ...Object.entries(P).map(([k,v]) => [k, nm(v)])];
  $("#tlChips").innerHTML = opts.map(([k,l]) => `<button class="chip" type="button" data-k="${k}" aria-pressed="${k===filter}">${esc(l)}</button>`).join("");
}
function timeline(){
  const list = EV.filter(e => filter==="all" || e.w.includes(filter));
  $("#tl").innerHTML = list.length ? list.map(e => { const st=S(e.id); return `
    <li class="ev${e.fall?" fall":""}">
      <div class="when"><span>${esc(e.y)}</span>${esc(e.d[lang])}</div>
      <div class="body">
        <h3>${esc(st.title)}</h3>
        <p>${esc(st.dek)}</p>
        <div class="meta">
          <span class="place">${esc(placeName(e.p,lang))}</span>
          ${e.fall?`<span class="tag fallen">${T("fallen")}</span>`:""}${e.era?`<span class="tag era">${T("ctx")}</span>`:""}${e.disp?`<span class="tag disp-t">${T("disp")}</span>`:""}
          <span class="src">${srcLinks(e.s)}</span>
        </div>
        <button class="read" type="button" data-open="E:${e.id}">${T("read")} →</button>
      </div>
    </li>`}).join("") : `<li class="empty">${T("empty")}</li>`;
}
function card(k,v,set){
  return `<button class="card" type="button" data-open="${set}:${k}">
    <span class="nm" lang="ta">${esc(v.ta)}</span>
    <span class="sub">${esc(v.en)}</span>
    <span class="yrs">${esc(v.yrs)}</span>
    <span class="role">${esc(v.role[lang])}</span>
    <span class="fate">${esc(v.fate[lang])}</span>
    <span class="more">${T("read")} →</span>
  </button>`;
}
function heroes(){
  $("#heroGrid").innerHTML = Object.entries(P).map(([k,v]) => card(k,v,"P")).join("");
  $("#otherGrid").innerHTML = Object.entries(O).map(([k,v]) => card(k,v,"O")).join("");
}

/* map */
const LON0=77.2, LAT1=11.7, K=165, OX=40, OY=24;
const px = lon => OX + (lon-LON0)*K, py = lat => OY + (LAT1-lat)*K;
let curPlace = "panch";
function drawMap(){
  let s = "";
  for(let lon=77.5; lon<=79.0; lon+=0.5){ const x=px(lon); s += `<line class="grat" x1="${x}" y1="${OY}" x2="${x}" y2="${py(8.5)}"/><text class="glab" x="${x}" y="${py(8.5)+14}" text-anchor="middle">${lon.toFixed(1)}°E</text>`; }
  for(let lat=9.0; lat<=11.5; lat+=0.5){ const y=py(lat); s += `<line class="grat" x1="${OX}" y1="${y}" x2="${px(79.5)}" y2="${y}"/><text class="glab" x="${OX-6}" y="${y+3}" text-anchor="end">${lat.toFixed(1)}°N</text>`; }
  Object.entries(PL).forEach(([k,p]) => {
    const x=px(p.lon), y=py(p.lat), left=p.lx===-1;
    s += `<g class="pt${p.fall?" fall":""}${k===curPlace?" on":""}" data-p="${k}" tabindex="0" role="button" aria-label="${esc(p[lang])}">
      <circle cx="${x}" cy="${y}" r="6"/>
      <text x="${left?x-10:x+10}" y="${y+4}" text-anchor="${left?"end":"start"}">${esc(p[lang])}</text></g>`;
  });
  $("#mapSvg").innerHTML = s;
  $("#mapSvg").setAttribute("aria-label", T("mH"));
}
function showPlace(k){
  curPlace = k; const p = PL[k];
  document.querySelectorAll(".pt").forEach(g => g.classList.toggle("on", g.dataset.p===k));
  const evs = EV.filter(e => e.p===k);
  $("#pinfo").innerHTML = `<p class="eyebrow">${esc(nm2(p))}</p><h3 class="disp">${esc(p[lang])}</h3><p>${esc(p.x[lang])}</p>
    <p class="eyebrow">${T("peopleHere")}</p>
    <div class="plist">${p.w.map(h => `<button class="chip" type="button" data-open="P:${h}">${esc(nm(P[h]))}</button>`).join("")}</div>
    ${evs.length?`<p class="eyebrow">${T("related")}</p><div class="plist">${evs.map(e => `<button class="chip" type="button" data-open="E:${e.id}">${esc(e.d[lang])}</button>`).join("")}</div>`:""}`;
}

function records(){
  $("#disputes").innerHTML = DISPUTES.map(d => `<div class="dsp"><h3>${esc(d.q[lang])}</h3><p>${esc(d.a[lang])}</p><p class="src">${srcLinks(d.s)}</p></div>`).join("");
  $("#gloss").innerHTML = GLOSS.map(g => `<div><dt>${esc(lang==="ta"?g.ta:g.en)}<span class="alt">${esc(lang==="ta"?g.en:g.ta)}</span></dt><dd>${esc(g.d[lang])}</dd></div>`).join("");
  $("#srcList").innerHTML = Object.entries(SRC).map(([i,[t,u]]) => `<li id="src-${i}"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join("");
}

/* reader */
const rd = $("#reader");
let cur = null; // {set, id}
const seq = set => set==="E" ? EV.map(e=>e.id) : Object.keys(set==="P"?P:O);
function openStory(set,id){
  cur = {set,id};
  const st = S(id);
  const list = seq(set), i = list.indexOf(id);
  let meta = "", rel = "", srcs = [];
  if(set==="E"){
    const e = EV.find(x=>x.id===id); srcs = e.s;
    meta = `<span>${esc(e.d[lang])}</span><span>${esc(placeName(e.p,lang))}</span>${e.w.map(h=>`<button class="linkbtn" type="button" data-open="P:${h}">${esc(nm(P[h]))}</button>`).join("")}`;
    $("#rdKick").textContent = T("kEvent");
  } else {
    const v = (set==="P"?P:O)[id]; srcs = v.src;
    meta = `<span lang="ta" class="ta">${esc(v.ta)}</span><span>${esc(v.en)}</span><span>${esc(v.yrs)}</span>`;
    $("#rdKick").textContent = set==="P" ? T("kHero") : T("kOther");
    const evs = EV.filter(e => e.w.includes(id));
    if(evs.length) rel = `<div class="rel"><b class="eyebrow">${T("related")}</b><ul>${evs.map(e => `<li><button class="linkbtn" type="button" data-open="E:${e.id}">${esc(e.d[lang])} · ${esc(S(e.id).title)}</button></li>`).join("")}</ul></div>`;
  }
  const body = st.body.map(([k,txt]) =>
    k==="h" ? `<h2>${esc(txt)}</h2>` :
    k==="t" ? `<div class="trad"><b>${T("trad")}</b><p>${esc(txt)}</p></div>` :
    k==="n" ? `<div class="note"><b>${T("note")}</b><p>${esc(txt)}</p></div>` :
    `<p>${esc(txt)}</p>`).join("");
  $("#rdBody").innerHTML = `<article class="story">
    <h1 class="disp" id="rdTitle">${esc(st.title)}</h1>
    <p class="dek">${esc(st.dek)}</p>
    <div class="rmeta">${meta}</div>
    ${body}
    <p class="src">${T("srcs")}: ${srcs.map(n => `<a href="${esc(SRC[n][1])}" target="_blank" rel="noopener">[${n}] ${esc(SRC[n][0])}</a>`).join(" · ")}</p>
    ${rel}
  </article>`;
  $("#rdBody").scrollTop = 0;
  const pv = list[i-1], nx = list[i+1];
  const lab = k => set==="E" ? S(k).title : nm((set==="P"?P:O)[k]);
  $("#rdPrev").hidden = !pv; $("#rdNext").hidden = !nx;
  if(pv){ $("#rdPrev").textContent = "← " + lab(pv); $("#rdPrev").dataset.open = set+":"+pv; }
  if(nx){ $("#rdNext").textContent = lab(nx) + " →"; $("#rdNext").dataset.open = set+":"+nx; }
  $("#rdClose").textContent = T("close");
  $("#rdLang").textContent = T("switchTo");
  if(!rd.open) rd.showModal();
}
$("#rdClose").addEventListener("click", () => rd.close());
rd.addEventListener("click", ev => { if(ev.target === rd) rd.close() });
$("#rdLang").addEventListener("click", () => { setLang(lang==="ta"?"en":"ta"); if(cur) openStory(cur.set,cur.id) });
$("#rdBody").addEventListener("click", ev => { const a = ev.target.closest('a[href^="#src-"]'); if(a) rd.close() });

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-open]"); if(!b) return;
  const [set,id] = b.dataset.open.split(":"); openStory(set,id);
});
$("#tlChips").addEventListener("click", ev => {
  const b = ev.target.closest(".chip"); if(!b) return;
  filter = b.dataset.k; chips(); timeline();
  try{ localStorage.setItem("palayam-filter", filter) }catch(e){}
});
$("#mapSvg").addEventListener("click", ev => { const g = ev.target.closest(".pt"); if(g) showPlace(g.dataset.p) });
$("#mapSvg").addEventListener("keydown", ev => { const g = ev.target.closest(".pt"); if(g && (ev.key==="Enter"||ev.key===" ")){ ev.preventDefault(); showPlace(g.dataset.p) } });
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

function setLang(l){
  lang = l;
  try{ localStorage.setItem("palayam-lang", l) }catch(e){}
  renderAll();
}
function renderAll(){ renderStatic(); chips(); timeline(); heroes(); drawMap(); showPlace(curPlace); records(); }
renderAll();
</script>

</body>
</html>
